name: Build Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK/AAB
    runs-on: ubuntu-latest

    env:
      # Optional: set these repository secrets for stable, update-compatible signing.
      # If not set, sign.sh will generate an ephemeral key (APKs cannot update existing installs).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install yarn
        run: npm install -g yarn

      - name: Install app dependencies
        run: yarn setup

      - name: Enable MANAGE_EXTERNAL_STORAGE permission (matches nightly)
        run: node utils/storage_manager.mjs y

      - name: Build Android dev apk
        run: yarn build android paid dev

      - name: Build Android prod aab
        run: yarn build android paid prod bundle

      - name: Move build artifacts to repo root
        run: |
          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk || { echo "ERROR: debug APK not found"; exit 1; }
          test -f platforms/android/app/build/outputs/bundle/release/app-release.aab || { echo "ERROR: release AAB not found"; exit 1; }
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk ./Acode-dev.apk
          mv platforms/android/app/build/outputs/bundle/release/app-release.aab ./Acode-prod.aab

      - name: Make sign.sh executable
        run: chmod +x ./sign.sh

      - name: Sign AAB -> universal APK (stored key or ephemeral fallback)
        run: ./sign.sh

      - name: Remove decoded keystore (safety net if sign.sh aborted early)
        if: always()
        run: rm -f acode.jks || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ./*.apk
          if-no-files-found: error

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ./*.aab
          if-no-files-found: error

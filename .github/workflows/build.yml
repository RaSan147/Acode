name: Build Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK/AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install yarn
        run: npm install -g yarn

      - name: Install app dependencies
        run: yarn setup

      - name: Configure the platform
        run: yarn clean

      - name: Build Android dev apk
        run: yarn build android paid dev

      - name: Build Android prod aab
        run: yarn build android paid prod bundle

      - name: Move build artifacts to repo root
        run: |
          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk || { echo "ERROR: debug APK not found"; exit 1; }
          test -f platforms/android/app/build/outputs/bundle/release/app-release.aab || { echo "ERROR: release AAB not found"; exit 1; }
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk ./Acode-dev.apk
          mv platforms/android/app/build/outputs/bundle/release/app-release.aab ./Acode-prod.aab

      - name: Make sign.sh executable
        run: chmod +x ./sign.sh

      - name: Convert signed AAB -> universal APK
        run: ./sign.sh

      - name: Remove decoded keystore
        if: always()
        run: rm -f acode.jks || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ./*.apk
          if-no-files-found: error

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ./*.aab
          if-no-files-found: error
